
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}ServerDoc{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">


  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">

  <link rel="stylesheet" href="{% static "css/styles.css" %}">

  <!-- jQuery + DataTables JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.colVis.min.js"></script>


  <!-- ECHARTS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js" integrity="sha512-XSmbX3mhrD2ix5fXPTRQb2FwK22sRMVQTpBP2ac8hX7Dh/605hA2QDegVWiAvZPiXIxOV0CbkmUjGionDpbCmw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  
</head>
<body>

  <div class="sidebar d-flex flex-column">
    <div class="logo">
      <i class="bi bi-terminal-fill me-2"></i> ServerDocs
    </div>

    <nav class="nav flex-column">
      <a href="{% url "home" %}" class="nav-link ">
        <i class="bi bi-house-door me-2"></i> Dashboard
      </a>

      <!-- Submenú DNS -->
      <a class="nav-link d-flex justify-content-between align-items-center" data-bs-toggle="collapse" href="#dnsCollapse" role="button" aria-expanded="false" aria-controls="dnsCollapse">
        <span><i class="bi bi-diagram-3 me-2"></i>DNS</span>
        <i class="bi bi-chevron-down"></i>
      </a>
      <div class="collapse" id="dnsCollapse">
        <div class="nav flex-column submenu">
          <a href="/dns/" class="nav-link ">
            <i class="bi bi-server me-2"></i> Servidores DNS
          </a>
          <a href="/dns-entry/" class="nav-link ">
            <i class="bi bi-node-plus me-2"></i> Entradas DNS
          </a>
        </div>
      </div>
      
      <a href="/os/" class="nav-link ">
        <i class="bi bi-hdd-network me-2"></i> OS
      </a>

      <a href="/servidores/" class="nav-link ">
        <i class="bi bi-hdd-network me-2"></i> Servidores
      </a>

     
      <a href="{% url 'logout' %}" class="nav-link">
        <i class="bi bi-box-arrow-right me-2"></i> Salir
      </a>
    </nav>
  </div>

  <div class="main-content">
    {% if messages %}
      <div class="container mt-3">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
