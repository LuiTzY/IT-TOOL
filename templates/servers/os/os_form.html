{% extends "layout/base.html" %}
{% block title %}SO{% endblock %}
{% block content %}
<h2>{{ view.object.pk|yesno:"Editar Sistema Operativo,Nuevo Sistema Operativo" }}</h2>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-success">Guardar</button>
  <a href="{% url 'os_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
