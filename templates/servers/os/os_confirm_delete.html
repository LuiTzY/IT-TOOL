{% extends "layout/base.html" %}
{% block content %}
<h2>¿Eliminar sistema operativo?</h2>
<p>¿Estás seguro de que deseas eliminar <strong>{{ object.nombre }} {{ object.version }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Sí, eliminar</button>
  <a href="{% url 'os_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
